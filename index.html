<!doctype html>
<html lang="en" class="dark" style="background-color: #000000;">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oculis</title>
    <meta name="description" content="Oculis - Ultra-modern executive dashboard and agile kanban orchestrator with real-time Google Calendar synchronization, proactive deadline automations, and Gmail dispatch." />
    <meta property="og:title" content="Oculis" />
    <meta property="og:description" content="Oculis - Ultra-modern executive dashboard and agile kanban orchestrator with real-time Google Calendar synchronization, proactive deadline automations, and Gmail dispatch." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/jpeg" href="/assets/oculis/logo.jpg" />
    <link rel="apple-touch-icon" href="/assets/oculis/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-[var(--accent-primary)]/20 selection:text-[var(--text-primary)]">
    <div id="root">
      <div style="min-height: 100vh; background-color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="position: relative; width: 140px; height: 140px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 50px rgba(239, 68, 68, 0.35); border: 1px solid rgba(239, 68, 68, 0.4); animation: ocPulse 2s infinite ease-in-out;">
          <img src="/assets/oculis/logo.jpg" alt="Loading Oculis" style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="width: 120px; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: #ef4444; border-radius: 9999px; animation: ocLoading 1.4s infinite ease-in-out;"></div>
          </div>
          <span style="color: #94a3b8; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; font-family: monospace; font-weight: 600;">Booting Workspace...</span>
        </div>
        <style>
          @keyframes ocLoading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
          @keyframes ocPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
